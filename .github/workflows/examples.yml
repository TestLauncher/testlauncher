name: Public examples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm test
      - run: npm run check
      - run: node scripts/bugagent-plugin.mjs validate
      - run: node scripts/bugagent-plugin.mjs build
      - run: node scripts/bugagent-plugin.mjs validate-zip
